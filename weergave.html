<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Wachtrij Scherm</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* LAYOUT: SPLIT SCREEN */
        body { 
            background-color: var(--light); 
            color: var(--dark); 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden;
        }

        /* HEADER */
        .header {
            background: white;
            padding: 15px 30px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            height: 80px; /* Vaste hoogte */
        }

        /* MAIN CONTAINER (DE SPLITSING) */
        .split-container {
            display: flex;
            flex: 1; /* Vult de rest van het scherm */
            height: calc(100vh - 80px); /* Trek header eraf */
        }

        /* LINKER KANT: GROTE OPROEP */
        .left-panel {
            flex: 1; /* Neemt 50% ruimte */
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-right: 1px solid #eee;
            position: relative;
        }

        .groot-nummer {
            font-size: 15rem; /* Nog groter */
            font-weight: 800;
            color: #d14977; /* JOUW SPECIFIEKE KLEUR */
            line-height: 1;
            margin-bottom: 20px;
        }

        .groot-kamer {
            font-size: 3rem;
            color: var(--dark);
            font-weight: 300;
        }
        
        .label-nieuw {
            position: absolute;
            top: 20px;
            left: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ccc;
            font-weight: bold;
        }

        /* RECHTER KANT: LIJST */
        .right-panel {
            flex: 1; /* Neemt 50% ruimte */
            background: #f8f9fc;
            padding: 30px;
            overflow-y: auto; /* Scrollbaar als het er veel zijn */
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .right-header {
            color: var(--secondary);
            font-size: 1.5rem;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e3e6f0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* KAARTJES IN RECHTER LIJST */
        .list-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 6px solid #ccc; /* Standaard grijs */
            animation: slideInRight 0.5s ease;
        }
        
        .list-card.accent {
            border-left-color: var(--secondary); /* Cyaan accent */
        }

        .list-nummer {
            font-size: 2.5rem;
            font-weight: bold;
            color: #555;
        }
        
        .list-kamer {
            font-size: 1.2rem;
            color: #888;
            text-align: right;
        }

        /* ANIMATIES */
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* OVERLAY */
        #startOverlay {
            background: rgba(255,255,255,0.98); 
        }
    </style>
</head>
<body>

    <div id="startOverlay" style="position: fixed; top:0; left:0; width:100%; height:100%; z-index:99; display:flex; justify-content:center; align-items:center; flex-direction:column;">
        <img src="Logovv.jpg" style="width: 150px; margin-bottom: 20px;">
        <h1 style="color: var(--primary);">Klik om scherm te starten</h1>
        <button onclick="startScherm()" class="btn-primary" style="font-size:24px; padding:20px 40px;">START SCHERM</button>
    </div>

    <div class="header">
        <img src="Logovv.jpg" alt="Logo" style="height: 60px;">
        <div style="font-size: 24px; font-weight: bold; color: var(--dark);">Volgnummers</div>
    </div>
    
    <div class="split-container">
        
        <div class="left-panel" id="linksPaneel">
            <div class="label-nieuw">Nu aan de beurt</div>
            <div class="groot-nummer" id="grootNummer">--</div>
            <div class="groot-kamer" id="grootKamer">Wachten...</div>
        </div>

        <div class="right-panel">
            <div class="right-header">
                <i class="fas fa-clipboard-list"></i> Ook in behandeling
            </div>
            <div id="rechterLijst">
                </div>
        </div>

    </div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { collection, onSnapshot, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const audio = new Audio('dingdong.mp3');
        let eersteKeerLaden = true;

        window.startScherm = () => {
            document.getElementById('startOverlay').style.display = 'none';
            startLuisteren();
        };

        function startLuisteren() {
            // Sorteren op startTijd (zodat de laatste oproep altijd bovenaan staat en links komt)
            const q = query(
                collection(db, "tickets"), 
                where("status", "==", "bezig"), 
                orderBy("startTijd", "desc")
            );

            onSnapshot(q, (snapshot) => {
                const rechterLijst = document.getElementById("rechterLijst");
                rechterLijst.innerHTML = "";

                // Geluidje trigger
                snapshot.docChanges().forEach((change) => {
                    if (change.type === "added" && !eersteKeerLaden) {
                        audio.play().catch(e => console.log(e));
                    }
                });

                if (!snapshot.empty) {
                    // --- 1. DE NIEUWSTE (Index 0) -> LINKERKANT ---
                    const nieuwste = snapshot.docs[0].data();
                    
                    document.getElementById("grootNummer").innerText = `${nieuwste.nummer}`;
                    
                    // Pulse Animatie op het linkerpaneel
                    const linksPaneel = document.getElementById("linksPaneel");
                    linksPaneel.style.animation = 'none';
                    linksPaneel.offsetHeight; /* trigger reflow */
                    linksPaneel.style.animation = 'pulse 0.5s'; 
                    
                    document.getElementById("grootKamer").innerHTML = `<i class="fas fa-arrow-right" style="color:#d14977"></i> ${nieuwste.kamer}`;

                    // --- 2. DE REST (Index > 0) -> RECHTERKANT ---
                    if (snapshot.docs.length > 1) {
                        snapshot.docs.forEach((doc, index) => {
                            if(index > 0) { // Sla de eerste over, die staat al links
                                const data = doc.data();
                                const div = document.createElement("div");
                                div.className = "list-card accent";
                                div.innerHTML = `
                                    <div class="list-nummer">Nr. ${data.nummer}</div>
                                    <div class="list-kamer">
                                        <i class="fas fa-door-open" style="font-size:16px;"></i> ${data.kamer}
                                    </div>
                                `;
                                rechterLijst.appendChild(div);
                            }
                        });
                    } else {
                        rechterLijst.innerHTML = "<div style='color:#999; text-align:center; margin-top:50px;'>Geen andere nummers in behandeling.</div>";
                    }

                } else {
                    document.getElementById("grootNummer").innerText = "--";
                    document.getElementById("grootKamer").innerText = "Geen oproepen";
                    rechterLijst.innerHTML = "";
                }
                eersteKeerLaden = false;
            });
        }
    </script>
</body>
</html>
