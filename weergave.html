<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Wachtrij Scherm</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dark-mode" style="text-align: center; display: flex; flex-direction: column; height: 100vh;">

    <div id="startOverlay" style="position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:99; display:flex; justify-content:center; align-items:center; flex-direction:column; color:white;">
        <i class="fas fa-volume-up fa-5x" style="margin-bottom: 20px;"></i>
        <h1>Klik om scherm te starten</h1>
        <button onclick="startScherm()" class="btn-success" style="font-size:24px; padding:20px 40px;">START</button>
    </div>

    <div style="padding: 20px;">
        <h2 style="color: #888; text-transform: uppercase; letter-spacing: 2px;">Nu aan de beurt</h2>
    </div>
    
    <div style="flex: 1; display: flex; justify-content: center; align-items: center;">
        <div id="grootScherm">
            <div class="groot-nummer" id="grootNummer">--</div>
            <div class="groot-kamer" id="grootKamer"><i class="fas fa-arrow-right"></i> Wachten...</div>
        </div>
    </div>

    <div style="background: #16213e; padding: 30px; border-top: 1px solid #333;">
        <h3 style="color: #888; margin-bottom: 20px;">Ook in behandeling:</h3>
        <div class="lijst-bezig" id="andereLijst" style="display: flex; justify-content: center; gap: 30px; flex-wrap: wrap;">
            </div>
    </div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { collection, onSnapshot, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const audio = new Audio('dingdong.mp3');
        let eersteKeerLaden = true;

        window.startScherm = () => {
            document.getElementById('startOverlay').style.display = 'none';
            startLuisteren();
        };

        function startLuisteren() {
            const q = query(collection(db, "tickets"), where("status", "==", "bezig"), orderBy("timestamp", "desc"));

            onSnapshot(q, (snapshot) => {
                const andereLijst = document.getElementById("andereLijst");
                andereLijst.innerHTML = "";

                // Geluidje trigger
                snapshot.docChanges().forEach((change) => {
                    if (change.type === "added" && !eersteKeerLaden) {
                        audio.play().catch(e => console.log(e));
                    }
                });

                if (!snapshot.empty) {
                    const nieuwste = snapshot.docs[0].data();
                    document.getElementById("grootNummer").innerText = `${nieuwste.nummer}`;
                    document.getElementById("grootKamer").innerHTML = `${nieuwste.kamer}`; // pijl is nu css

                    snapshot.docs.forEach((doc, index) => {
                        if(index > 0) { 
                            const data = doc.data();
                            const div = document.createElement("div");
                            // Styling voor kleine kaartjes
                            div.style.background = "#0f3460";
                            div.style.padding = "15px 30px";
                            div.style.borderRadius = "10px";
                            div.style.border = "1px solid #1a1a2e";
                            div.innerHTML = `<span style="font-size:30px; font-weight:bold; color:var(--primary);">${data.nummer}</span><br><span style="color:#ccc;">${data.kamer}</span>`;
                            andereLijst.appendChild(div);
                        }
                    });
                } else {
                    document.getElementById("grootNummer").innerText = "--";
                    document.getElementById("grootKamer").innerText = "Geen oproepen";
                }
                eersteKeerLaden = false;
            });
        }
    </script>
</body>
</html>
