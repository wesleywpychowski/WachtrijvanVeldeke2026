<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weergave Scherm</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            padding: 50px 80px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }

        .message {
            font-size: 2rem;
            color: #333;
            margin-bottom: 20px;
            font-weight: 600;
            /* Extra zekerheid voor hoofdletters via CSS */
            text-transform: uppercase; 
        }

        .lokaal-nummer {
            font-size: 6rem;
            font-weight: bold;
            color: #007bff;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="message">GA NAAR LOKAAL</div>
        
        <div class="lokaal-nummer" id="lokaal">101</div>
    </div>

    <script>
        // Optioneel: Script om dynamisch data op te halen (bijv. via URL parameters of LocalStorage)
        // Voor nu staat er statisch '101'
    </script>

</body>
</html>
