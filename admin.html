<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .grid { display: flex; gap: 20px; }
        .column { flex: 1; background: #fff; padding: 15px; border-radius: 8px; }
        .kamer-box { border: 2px solid #007bff; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Admin Dashboard</h1>
    <div style="text-align: right; margin-bottom: 20px;">
        <button onclick="resetSysteem()" style="background: red; font-size: 12px;">⚠ RESET SYSTEEM</button>
    </div>

    <div class="grid">
        <div class="column">
            <h2>Wachtrij</h2>
            <div id="wachtrijLijst">Laden...</div>
        </div>

        <div class="column">
            <h2>Kamers & Bediening</h2>
            <div id="kamersLijst">
                </div>
        </div>
    </div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { collection, onSnapshot, query, where, orderBy, updateDoc, doc, setDoc, getDocs, deleteDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // CONFIGURATIE KAMERS
        const kamers = [
            { id: 1, naam: "Lokaal 101" },
            { id: 2, naam: "Secretariaat" },
            { id: 3, naam: "Directie" }
        ];

        // 1. Laad de wachtrij (REAL-TIME!)
        const q = query(collection(db, "tickets"), where("status", "==", "wachtend"), orderBy("timestamp"));
        
        onSnapshot(q, (snapshot) => {
            const lijst = document.getElementById("wachtrijLijst");
            lijst.innerHTML = "";
            
            if(snapshot.empty) { lijst.innerHTML = "<p>Geen wachtenden.</p>"; }

            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const div = document.createElement("div");
                div.className = "card status-wachtend";
                div.innerHTML = `
                    <div>
                        <strong>Nr. ${data.nummer}</strong><br>
                        <small>${data.opmerking || ''}</small>
                    </div>
                    <button onclick="verwijderTicket('${docSnap.id}')" style="background: #ccc; padding: 5px 10px;">X</button>
                `;
                lijst.appendChild(div);
            });
        });

        // 2. Render de Kamers
        function renderKamers() {
            const container = document.getElementById("kamersLijst");
            container.innerHTML = "";
            kamers.forEach(k => {
                const div = document.createElement("div");
                div.className = "kamer-box";
                div.innerHTML = `
                    <h3>${k.naam}</h3>
                    <button onclick="roepVolgende(${k.id}, '${k.naam}')">Roep Volgende</button>
                    <button onclick="toonAfhandelen(${k.id})" style="background:green; display:none;" id="klaarBtn-${k.id}">Afronden</button>
                    <div id="huidigTicket-${k.id}" style="font-weight:bold; color: blue;">Vrij</div>
                `;
                container.appendChild(div);
            });
        }
        renderKamers();

        // 3. Functies beschikbaar maken voor HTML (window object)
        window.verwijderTicket = async (id) => {
            if(confirm("Verwijderen?")) await deleteDoc(doc(db, "tickets", id));
        };

        window.roepVolgende = async (kamerId, kamerNaam) => {
            // Zoek oudste ticket
            const qWacht = query(collection(db, "tickets"), where("status", "==", "wachtend"), orderBy("timestamp"), limit(1));
            const snapshot = await getDocs(qWacht); // Hier gebruiken we getDocs ipv onSnapshot omdat we 1x willen halen

            if (!snapshot.empty) {
                const ticket = snapshot.docs[0];
                await updateDoc(doc(db, "tickets", ticket.id), {
                    status: 'bezig',
                    kamer: kamerNaam,
                    kamerId: kamerId
                });
                
                // Update UI (simpel gehouden, idealiter ook real-time luisteren naar 'bezig' status)
                document.getElementById(`huidigTicket-${kamerId}`).innerText = `Bezig met Nr. ${ticket.data().nummer}`;
                document.getElementById(`klaarBtn-${kamerId}`).style.display = 'inline-block';
            } else {
                alert("Niemand in de wachtrij!");
            }
        };
        
        // Nodig om limit te gebruiken
        import { limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        window.toonAfhandelen = async (kamerId) => {
            // Normaal zoek je hier het actieve ticket bij de kamer, voor nu simpele reset
            let notitie = prompt("Wil je een persoonlijk bericht toevoegen voor het archief?", "");
            
            // We moeten het ticket vinden dat nu 'bezig' is bij deze kamer
            const qBezig = query(collection(db, "tickets"), where("status", "==", "bezig"), where("kamerId", "==", kamerId));
            const snap = await getDocs(qBezig);
            
            snap.forEach(async (t) => {
                await updateDoc(doc(db, "tickets", t.id), {
                    status: 'afgehandeld',
                    adminNotitie: notitie || ''
                });
            });

            document.getElementById(`huidigTicket-${kamerId}`).innerText = "Vrij";
            document.getElementById(`klaarBtn-${kamerId}`).style.display = 'none';
        };

        window.resetSysteem = async () => {
            if(prompt("Typ 'RESET' om alles te wissen") === "RESET") {
                // Hier zou je een batch delete doen. Voor nu: reset alleen de teller.
                // In productie moet je hier alle tickets verwijderen.
                const settingsRef = doc(db, "settings", "teller");
                await setDoc(settingsRef, { laatsteNummer: 0 });
                alert("Teller gereset naar 0. (Tickets moet je nog handmatig verwijderen in Firebase console voor een volledige clean-up in deze demo versie)");
                location.reload();
            }
        };
    </script>
</body>
</html>
